name: CI R14944043

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, format, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests and generate JUnit report
        run: |
          mkdir -p reports
          npm run test -- --reporter=default --reporter=junit --outputFile=reports/junit.xml

      - name: Publish test report to GitHub Actions
        if: ${{ always() && hashFiles('reports/junit.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Vitest Test Report
          path: reports/junit.xml
          reporter: java-junit
          fail-on-error: 'false'
          use-actions-summary: 'true'

      - name: Upload JUnit report artifact
        if: ${{ always() && hashFiles('reports/junit.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: reports/junit.xml
